name: maintain
# Manual trigger only for now (add a `schedule:` cron once a run has been validated).
on:
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: maintain, cancel-in-progress: false }
jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Anchor + grounding run on the Claude Code subscription via the CLI. On an isolated CI
      # runner there are no competing claude sessions, so `claude -p` is reliable here.
      - run: npm install -g @anthropic-ai/claude-code
      - name: extract (fetch new sources -> consensus pipeline -> content)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          python scripts/fetch_sources.py
          python scripts/extract_consensus.py
      - run: python scripts/lint_frontmatter.py        # red-line gate before any commit
      - run: python eval/run_eval.py                   # report only (gold lags newly found edges)
      - name: commit & push (push triggers deploy.yml)
        run: |
          git config user.name  "comatlas-bot"
          git config user.email "bot@kinthai.ai"
          git add content raw/_state.json review_queue.md
          git diff --cached --quiet && echo "no changes — nothing to maintain" && exit 0
          git commit -m "auto: update KG from new sources (consensus pipeline)"
          git push
